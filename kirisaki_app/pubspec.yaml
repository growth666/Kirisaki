name: kirisaki_app
description: "Kirisaki —— 跨平台二次元图片搜图客户端"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 网络请求
  dio: ^5.11.0
  # HTTP 请求（图源解析服务使用）
  http: ^1.6.0
  crypto: ^3.0.7
  # HTML 解析（CSS 选择器）
  html: ^0.15.7
  # Web 平台 API（浏览器下载实现用，规避已废弃的 dart:html）
  web: ^1.1.1
  # 系统目录获取（桌面端下载实现用）
  path_provider: ^2.1.6
  # 桌面端目录选择器（下载位置自选用）
  file_selector: ^1.1.0
  # 网络图片加载与缓存
  cached_network_image: ^3.4.1
  # 瀑布流网格布局
  flutter_staggered_grid_view: ^0.7.0
  # 声明式路由
  go_router: ^18.0.0
  # 本地偏好存储
  shared_preferences: ^2.5.5
  # 运行时权限申请
  permission_handler: 11.3.1
  # 图片保存到系统相册
  gallery_saver_plus: ^3.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # shared_preferences 官方内存测试实现
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/search/keywords.json
    - assets/search/danbooru_local.json
    - assets/search/DanbooruSearchOnline-LICENSE.txt
